name: windows-build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      app_name: ${{ steps.version.outputs.app_name }}
      setup_name: ${{ steps.version.outputs.setup_name }}
      uninstaller_name: ${{ steps.version.outputs.uninstaller_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must be SemVer X.Y.Z, got '$version'."
          }

          $githubRef = '${{ github.ref }}'
          if ($githubRef.StartsWith('refs/tags/v')) {
            $tagVersion = $githubRef.Substring('refs/tags/v'.Length)
            if ($tagVersion -ne $version) {
              throw "Tag version '$tagVersion' does not match VERSION '$version'."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "app_name=Locking Glass.exe" >> $env:GITHUB_OUTPUT
          "setup_name=Locking Glass Installer.exe" >> $env:GITHUB_OUTPUT
          "uninstaller_name=Locking Glass Uninstaller.exe" >> $env:GITHUB_OUTPUT
          "artifact_name=locking-glass-windows-$version" >> $env:GITHUB_OUTPUT

      - name: Run release hygiene checks
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Hygiene

  windows-build-test:
    name: Windows Build Test
    needs: hygiene
    runs-on: windows-2025-vs2026
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build and test Windows release
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Build

  windows-package:
    name: Windows Package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - hygiene
      - windows-build-test
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ needs.hygiene.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build package input
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Build

      # Live proof scripts stay manual. GitHub-hosted runners do not provide an
      # interactive Windows desktop shell, multiple monitors, multiple virtual
      # desktops, or real tray interaction.
      - name: Package and smoke Windows release
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 `
            -Mode Package `
            -AppExeName '${{ needs.hygiene.outputs.app_name }}' `
            -SetupExeName '${{ needs.hygiene.outputs.setup_name }}' `
            -UninstallerExeName '${{ needs.hygiene.outputs.uninstaller_name }}'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.hygiene.outputs.artifact_name }}
          path: |
            build/release/${{ needs.hygiene.outputs.app_name }}
            build/release/${{ needs.hygiene.outputs.setup_name }}
            build/release/${{ needs.hygiene.outputs.uninstaller_name }}
            build/release/SHA256SUMS.txt
          if-no-files-found: error

  # Publication is tag-only; main and tag runs build package artifacts first.
  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.windows-package.outputs.artifact_name }}
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
