name: windows-release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      version: ${{ steps.version.outputs.version }}
      setup_name: ${{ steps.version.outputs.setup_name }}
      run_name: ${{ steps.version.outputs.run_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must be SemVer X.Y.Z, got '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "setup_name=Locking Glass Installer.exe" >> $env:GITHUB_OUTPUT
          "run_name=Locking Glass.exe" >> $env:GITHUB_OUTPUT
          "artifact_name=locking-glass-windows-$version" >> $env:GITHUB_OUTPUT

      - name: Run release hygiene checks
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Hygiene

  windows-build-test:
    name: Windows Build Test
    needs: hygiene
    runs-on: windows-2025-vs2026
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build and test Windows release
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Build

  windows-package:
    name: Windows Package
    if: github.ref == 'refs/heads/main'
    needs:
      - hygiene
      - windows-build-test
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ needs.hygiene.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build package input
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Build

      # Live proof scripts stay manual. GitHub-hosted runners do not provide an
      # interactive Windows desktop shell, multiple monitors, multiple virtual
      # desktops, or real tray interaction.
      - name: Package and smoke Windows release
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 `
            -Mode Package `
            -SetupExeName '${{ needs.hygiene.outputs.setup_name }}' `
            -RunExeName '${{ needs.hygiene.outputs.run_name }}'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.hygiene.outputs.artifact_name }}
          path: |
            build/release/${{ needs.hygiene.outputs.setup_name }}
            build/release/${{ needs.hygiene.outputs.run_name }}
          if-no-files-found: error

  # Publication is main-only; the release tag is resolved from VERSION.
  publish-release:
    name: Publish Release
    if: github.ref == 'refs/heads/main'
    needs:
      - hygiene
      - windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.windows-package.outputs.artifact_name }}
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: v${{ needs.hygiene.outputs.version }}
          name: v${{ needs.hygiene.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/*
