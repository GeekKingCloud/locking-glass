name: windows-release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must be SemVer X.Y.Z, got '$version'."
          }

          $githubRef = '${{ github.ref }}'
          if ($githubRef.StartsWith('refs/tags/v')) {
            $tagVersion = $githubRef.Substring('refs/tags/v'.Length)
            if ($tagVersion -ne $version) {
              throw "Tag version '$tagVersion' does not match VERSION '$version'."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "app_name=Locking Glass.exe" >> $env:GITHUB_OUTPUT
          "setup_name=Locking Glass Installer.exe" >> $env:GITHUB_OUTPUT
          "uninstaller_name=Locking Glass Uninstaller.exe" >> $env:GITHUB_OUTPUT
          "artifact_name=locking-glass-windows-$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Run release hygiene checks
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Hygiene

      - name: Build and test Windows release
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -Mode Build

      # Live proof scripts stay manual. GitHub-hosted runners do not provide an
      # interactive Windows desktop shell, multiple monitors, multiple virtual
      # desktops, or real tray interaction.
      - name: Package and smoke Windows release
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 `
            -Mode Package `
            -AppExeName '${{ steps.version.outputs.app_name }}' `
            -SetupExeName '${{ steps.version.outputs.setup_name }}' `
            -UninstallerExeName '${{ steps.version.outputs.uninstaller_name }}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            build/release/${{ steps.version.outputs.app_name }}
            build/release/${{ steps.version.outputs.setup_name }}
            build/release/${{ steps.version.outputs.uninstaller_name }}
            build/release/SHA256SUMS.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-release.outputs.artifact_name }}
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
